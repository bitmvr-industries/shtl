[package]
name = "shtl"
version = "2.0.0-dev"
edition = "2024"
description = "Save directories as routes with short names, then go to them by name"
license = "MIT"
repository = "https://github.com/bitmvr-industries/shtl"

[[bin]]
name = "shtl"
path = "src/main.rs"

[dependencies]
gethostname = "1.1.0"
toml_edit = "0.25.17"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
system-configuration-sys = "0.6"
