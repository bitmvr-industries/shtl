name: Release

# Builds shtl for each platform and attaches shtl-<os>-<arch>.tar.gz and
# checksums.txt to the release. Publish the release first:
#   gh release create vX.Y.Z --target master
# Run it by hand with no tag to build the files without a release (they are
# kept as workflow artifacts), or with a tag to build them again for it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the files to (empty to only build)
        required: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          # musl: one static binary for every Linux
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      # Pinned: this job builds the release files
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check the binary
        run: |
          bin="target/${{ matrix.target }}/release/shtl"
          "$bin" version
          file "$bin"
      - name: Package
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/shtl" LICENSE README.md dist/
          tar -czf "shtl-${{ matrix.name }}.tar.gz" -C dist shtl LICENSE README.md
      - uses: actions/upload-artifact@v7
        with:
          name: shtl-${{ matrix.name }}
          path: shtl-${{ matrix.name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    # Only this job writes to the release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum shtl-*.tar.gz | tee checksums.txt
      - uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: checksums.txt
      - name: Attach to the release
        if: github.event.release.tag_name || inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" shtl-*.tar.gz checksums.txt --clobber --repo "$GITHUB_REPOSITORY"
